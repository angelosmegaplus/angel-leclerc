name: Maintenance Angel OS

on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"

permissions:
  contents: read

concurrency:
  group: maintenance-angel-os
  cancel-in-progress: true

jobs:
  health-and-live-data:
    name: Vérifier le site et les données vivantes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      NEWSLETTER_CRON_SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}

    steps:
      - name: Check Angel AI end-to-end in production
        shell: bash
        run: |
          set -euo pipefail

          call_ai() {
            local payload="$1"
            local expected_code="$2"
            local label="$3"
            local tmp
            tmp="$(mktemp)"
            local started ended code
            started="$(date +%s%3N)"
            code="$(curl -L --silent --show-error --output "$tmp" --write-out '%{http_code}' --max-time 35 \
              -X POST \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "https://www.angel-leclerc.fr/api/assistant")"
            ended="$(date +%s%3N)"
            echo "[$label] HTTP $code · $((ended-started)) ms"
            cat "$tmp"
            echo
            if [ "$code" != "$expected_code" ]; then
              echo "::error::$label en échec (HTTP $code, attendu $expected_code)."
              return 1
            fi
            AI_TMP="$tmp"
          }

          # 1) Message minimal : le cœur fournisseur doit réellement répondre.
          call_ai '{"question":"Réponds uniquement par ANGEL_AI_OK si tu reçois ce test.","mode":"site","history":[]}' "200" "IA publique — message court"
          jq -e '(.source == "openai") and (.text | type == "string") and (.text | contains("ANGEL_AI_OK")) and (.text | test("<html|<!doctype"; "i") | not)' "$AI_TMP" >/dev/null

          # 2) Question normale : pas de placeholder, JSON brut ou réponse vide.
          call_ai '{"question":"En une phrase simple, explique à quoi sert ce site sans inventer d’information.","mode":"site","history":[]}' "200" "IA publique — question normale"
          jq -e '(.source == "openai") and (.text | type == "string") and (.text | length > 20) and (.text | test("<html|<!doctype|mode de secours|moteur local"; "i") | not)' "$AI_TMP" >/dev/null

          # 3) Mode Contact : même moteur réel, avec le contexte propre au formulaire public.
          call_ai '{"question":"Je veux contacter Angel au sujet d’un projet de communication. Réponds en une phrase utile.","mode":"contact","history":[]}' "200" "IA Contact"
          jq -e '(.source == "openai") and (.text | type == "string") and (.text | length > 20) and (.text | test("<html|<!doctype"; "i") | not)' "$AI_TMP" >/dev/null

          # 4) Conversation multi-tour : le chemin doit accepter et exploiter l’historique transmis.
          call_ai '{"question":"Quel est le mot témoin ? Réponds uniquement avec ce mot.","mode":"site","history":[{"role":"user","content":"Le mot témoin de cette conversation est ORION-27."},{"role":"assistant","content":"Bien reçu."}]}' "200" "IA publique — contexte multi-tour"
          jq -e '(.source == "openai") and (.text | type == "string") and (.text | contains("ORION-27"))' "$AI_TMP" >/dev/null

          # 5) Échec contrôlé : une entrée invalide doit être rejetée proprement, sans faux succès.
          call_ai '{"question":"x","mode":"site","history":[]}' "400" "IA publique — échec contrôlé"
          jq -e '(.text == null) and (.reason == "invalid_question")' "$AI_TMP" >/dev/null

          echo "Angel AI : scénarios publics, Contact, contexte et erreur contrôlée validés en production"

      - name: Check Angel AI health endpoint
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -L --silent --show-error --output "$tmp" --write-out '%{http_code}' --max-time 25 \
            "https://www.angel-leclerc.fr/api/angel-os/health")"
          cat "$tmp"
          if [ "$code" != "200" ]; then
            echo "::error::Health Angel OS indisponible (HTTP $code)."
            exit 1
          fi
          jq -e '.dependencies.openai.configured == true and .dependencies.openai.reachable == true' "$tmp" >/dev/null
          echo "Health OpenAI : configuré et joignable"

      - name: Synchroniser les candidatures avec Gmail
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEWSLETTER_CRON_SECRET:-}" ]; then
            echo "::warning::NEWSLETTER_CRON_SECRET absent : synchronisation candidatures ignorée sans bloquer la maintenance"
            exit 0
          fi

          tmp="$(mktemp)"
          code="$(curl -L --silent --show-error --output "$tmp" --write-out '%{http_code}' --max-time 90 \
            -X POST \
            -H "x-cron-token: ${NEWSLETTER_CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            "https://www.angel-leclerc.fr/api/public/hooks/applications-sync")"
          cat "$tmp"
          if [ "$code" != "200" ]; then
            echo "::warning::Synchronisation candidatures momentanément indisponible (HTTP $code) ; les autres contrôles continuent."
            exit 0
          fi
          if ! jq -e '.ok == true and (.syncedAt | type == "string")' "$tmp" >/dev/null; then
            echo "::warning::Réponse de synchronisation candidatures inexploitable ; les autres contrôles continuent."
            exit 0
          fi
          imported="$(jq -r '.imported // 0' "$tmp")"
          updated="$(jq -r '.updated // 0' "$tmp")"
          skipped="$(jq -r '.skipped // 0' "$tmp")"
          echo "Candidatures synchronisées : ${imported} importée(s), ${updated} mise(s) à jour, ${skipped} ignorée(s)."

      - name: Check out latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Build application
        run: bun run build

      - name: Type-check
        run: bunx tsc --noEmit --pretty false

      - name: Audit all concrete production pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://www.angel-leclerc.fr"
          sitemap_file="$(mktemp)"
          urls_file="$(mktemp)"
          templates_file="$(mktemp)"

          sitemap_code="$(curl --silent --show-error --output "$sitemap_file" --write-out '%{http_code}' --max-time 25 "$base/sitemap.xml")"
          if [ "$sitemap_code" != "200" ]; then
            echo "::error::Sitemap indisponible (HTTP $sitemap_code)."
            exit 1
          fi

          python3 - "$sitemap_file" "$urls_file" "$templates_file" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          sitemap_path, urls_path, templates_path = sys.argv[1:]
          base = "https://www.angel-leclerc.fr"
          urls = set()
          dynamic_templates = []

          # Les URL concrètes publiées (notamment articles/routes dynamiques) viennent du sitemap réel.
          try:
              root = ET.parse(sitemap_path).getroot()
              for node in root.iter():
                  if node.tag.endswith("loc") and node.text:
                      url = node.text.strip()
                      if url.startswith(base):
                          urls.add(url)
          except ET.ParseError as exc:
              raise SystemExit(f"Sitemap XML invalide: {exc}")

          # Les pages statiques sont inventoriées depuis le routeur fichier, pas depuis une liste figée.
          routes_root = Path("src/routes")
          for file in sorted(routes_root.rglob("*")):
              if not file.is_file() or file.suffix not in {".ts", ".tsx"}:
                  continue
              rel = file.relative_to(routes_root).as_posix()
              if rel == "__root.tsx" or rel.startswith(("api/", "lovable/", "oauth/")):
                  continue
              if "$" in rel:
                  dynamic_templates.append(rel)
                  continue

              route = rel
              for suffix in (".tsx", ".ts"):
                  if route.endswith(suffix):
                      route = route[:-len(suffix)]
                      break
              route = route.replace("[.]", ".")
              if route == "index":
                  route = ""
              elif route.endswith("/index"):
                  route = route[:-len("/index")]
              urls.add(base + "/" + route.lstrip("/"))

          Path(urls_path).write_text("\n".join(sorted(urls)) + "\n", encoding="utf-8")
          Path(templates_path).write_text("\n".join(dynamic_templates) + ("\n" if dynamic_templates else ""), encoding="utf-8")
          PY

          checked=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            code="$(curl -L --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 25 "$url")"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "::error::Page indisponible ou en erreur: $url (HTTP $code)"
              exit 1
            fi
            echo "OK $code $url"
            checked=$((checked + 1))
          done < "$urls_file"

          echo "Pages concrètes contrôlées : $checked"
          if [ -s "$templates_file" ]; then
            echo "Templates dynamiques sans identifiant sûr, couverts lorsqu'une URL concrète existe dans le sitemap :"
            sed 's/^/- /' "$templates_file"
          fi

          not_found_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$base/__angel_os_404_probe_$(date +%s)")"
          if [ "$not_found_code" != "404" ]; then
            echo "::warning::La route 404 de contrôle renvoie HTTP $not_found_code au lieu de 404."
          else
            echo "404 HTTP sémantique : OK"
          fi

      - name: Check public weather endpoint
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -L --silent --show-error --output "$tmp" --write-out '%{http_code}' --max-time 20 \
            "https://www.angel-leclerc.fr/api/admin/weather")"
          test "$code" = "200"
          jq -e '.location == "Sarlat-la-Canéda" and (.fetchedAt | type == "string")' "$tmp" >/dev/null
          echo "Météo publique OK"

      - name: Check public news endpoint
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -L --silent --show-error --output "$tmp" --write-out '%{http_code}' --max-time 25 \
            "https://www.angel-leclerc.fr/api/admin/news")"
          if [ "$code" != "200" ]; then
            echo "::warning::Flux actualités momentanément indisponible (HTTP $code)."
            exit 0
          fi
          jq -e '(.fetchedAt | type == "string") and (.items | type == "array")' "$tmp" >/dev/null
          echo "Actualités publiques OK"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Maintenance Angel OS"
            echo ""
            echo "- Commit vérifié : \`${GITHUB_SHA}\`"
            echo "- Angel AI public/Contact : tests réels court, normal, multi-tour et erreur contrôlée"
            echo "- Health IA : OpenAI configuré/joignable vérifié"
            echo "- Angel OS IA privé : chemin de code contrôlé séparément ; validation end-to-end nécessite une session admin authentifiée et ne doit pas être simulée"
            echo "- Candidatures : synchronisation Gmail tentée si le secret serveur est configuré ; un blocage de cette dépendance secondaire n'interrompt plus les contrôles principaux"
            echo "- Lint + build + TypeScript : exécutés sur GitHub Actions"
            echo "- Pages : inventaire dynamique depuis les routes + sitemap réel, avec contrôle HTTP des URL concrètes et sonde 404"
            echo "- API météo : contrôlée"
            echo "- API actualités : contrôlée"
          } >> "$GITHUB_STEP_SUMMARY"
