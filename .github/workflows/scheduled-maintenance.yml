name: Maintenance Angel OS

on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"

permissions:
  contents: read

concurrency:
  group: maintenance-angel-os
  cancel-in-progress: true

jobs:
  health-and-live-data:
    name: Vérifier le site et les données vivantes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      NEWSLETTER_CRON_SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}

    steps:
      - name: Check Angel AI end-to-end in production
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -L --silent --show-error --output "$tmp" --write-out '%{http_code}' --max-time 35 \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"question":"Réponds uniquement par ANGEL_AI_OK si tu reçois ce test.","mode":"site","history":[]}' \
            "https://www.angel-leclerc.fr/api/assistant")"
          cat "$tmp"
          if [ "$code" != "200" ]; then
            echo "::error::Angel AI indisponible en production (HTTP $code)."
            exit 1
          fi
          jq -e '.source == "openai" and (.text | type == "string") and (.text | length > 0)' "$tmp" >/dev/null
          echo "Angel AI OpenAI répond réellement en production"

      - name: Synchroniser les candidatures avec Gmail
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEWSLETTER_CRON_SECRET:-}" || { echo "::error::NEWSLETTER_CRON_SECRET absent : synchronisation candidatures impossible"; exit 1; }
          tmp="$(mktemp)"
          code="$(curl -L --silent --show-error --output "$tmp" --write-out '%{http_code}' --max-time 90 \
            -X POST \
            -H "x-cron-token: ${NEWSLETTER_CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            "https://www.angel-leclerc.fr/api/public/hooks/applications-sync")"
          cat "$tmp"
          if [ "$code" != "200" ]; then
            echo "::error::Synchronisation candidatures en échec (HTTP $code)."
            exit 1
          fi
          jq -e '.ok == true and (.syncedAt | type == "string")' "$tmp" >/dev/null
          imported="$(jq -r '.imported // 0' "$tmp")"
          updated="$(jq -r '.updated // 0' "$tmp")"
          skipped="$(jq -r '.skipped // 0' "$tmp")"
          echo "Candidatures synchronisées : ${imported} importée(s), ${updated} mise(s) à jour, ${skipped} ignorée(s)."

      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Build application
        run: bun run build

      - name: Type-check
        run: bunx tsc --noEmit --pretty false

      - name: Check critical public pages
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            "https://www.angel-leclerc.fr/"
            "https://www.angel-leclerc.fr/parcours"
            "https://www.angel-leclerc.fr/articles"
            "https://www.angel-leclerc.fr/contact"
            "https://www.angel-leclerc.fr/admin"
            "https://www.angel-leclerc.fr/angel-os-ia"
          )

          for url in "${pages[@]}"; do
            code="$(curl -L --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$url")"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "::error::Page indisponible ou en erreur: $url (HTTP $code)"
              exit 1
            fi
            echo "OK $code $url"
          done

      - name: Check public weather endpoint
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -L --silent --show-error --output "$tmp" --write-out '%{http_code}' --max-time 20 \
            "https://www.angel-leclerc.fr/api/admin/weather")"
          test "$code" = "200"
          jq -e '.location == "Sarlat-la-Canéda" and (.fetchedAt | type == "string")' "$tmp" >/dev/null
          echo "Météo publique OK"

      - name: Check public news endpoint
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -L --silent --show-error --output "$tmp" --write-out '%{http_code}' --max-time 25 \
            "https://www.angel-leclerc.fr/api/admin/news")"
          if [ "$code" != "200" ]; then
            echo "::warning::Flux actualités momentanément indisponible (HTTP $code)."
            exit 0
          fi
          jq -e '(.fetchedAt | type == "string") and (.items | type == "array")' "$tmp" >/dev/null
          echo "Actualités publiques OK"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Maintenance Angel OS"
            echo ""
            echo "- Commit vérifié : \`${GITHUB_SHA}\`"
            echo "- Angel AI OpenAI : test end-to-end réel exécuté en priorité sur /api/assistant"
            echo "- Candidatures : synchronisation Gmail réelle exécutée à chaque maintenance"
            echo "- Lint + build + TypeScript : exécutés sur GitHub Actions"
            echo "- Pages critiques : contrôlées"
            echo "- API météo : contrôlée"
            echo "- API actualités : contrôlée"
          } >> "$GITHUB_STEP_SUMMARY"
