name: Cache Canva portfolio images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-canva-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download portfolio previews from temporary bridge
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          mkdir -p public/portfolio /tmp/portfolio

          items=(
            logo-alc
            fds
            angel-os
            firebox
            eclaireurs-libres
            tombola
            gannat-ouverture
            freshtalk-radio
            collecte-dons
            identite-politique
          )

          for slug in "${items[@]}"; do
            echo "Downloading $slug"
            curl --fail --location --retry 4 --retry-delay 2 \
              "https://angel-leclerc.vercel.app/api/public/site-status?portfolio=${slug}&raw=1" \
              --output "/tmp/portfolio/${slug}.img"
          done

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('/tmp/portfolio')
          target = Path('public/portfolio')
          names = [
              'logo-alc', 'fds', 'angel-os', 'firebox', 'eclaireurs-libres',
              'tombola', 'gannat-ouverture', 'freshtalk-radio',
              'collecte-dons', 'identite-politique',
          ]

          for name in names:
              img = Image.open(source / f'{name}.img').convert('RGB')
              if img.width > 1400:
                  ratio = 1400 / img.width
                  img = img.resize((1400, round(img.height * ratio)), Image.Resampling.LANCZOS)
              out = target / f'{name}.webp'
              img.save(out, 'WEBP', quality=86, method=6)
              print(f'{name}: {img.width}x{img.height} -> {out.stat().st_size} bytes')
          PY

      - name: Point portfolio to local images and keep 10 strongest pieces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/routes/portfolio.tsx')
          s = p.read_text(encoding='utf-8')

          # Remove two redundant logo-exploration cards to keep a tighter 10-piece selection.
          for title in ('Série de logos personnels', 'Explorations de logos'):
              pattern = r'\n  \{\n    title: "' + re.escape(title) + r'",.*?\n  \},'
              s, count = re.subn(pattern, '', s, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Could not remove portfolio item: {title}')

          mapping = {
              'https://design.canva.ai/ERnnCTPVt0CNCx3': '/portfolio/logo-alc.webp',
              'https://design.canva.ai/-EDDkDRnp2w9V74': '/portfolio/fds.webp',
              'https://design.canva.ai/mynEfAulHgpDQUr': '/portfolio/angel-os.webp',
              'https://design.canva.ai/Lz9aJQyPySr0wgz': '/portfolio/firebox.webp',
              'https://design.canva.ai/o2Y_HSWMk12cmHW': '/portfolio/eclaireurs-libres.webp',
              'https://design.canva.ai/sObwXgi3qa0-CRM': '/portfolio/tombola.webp',
              'https://design.canva.ai/GH3oLueOxxXg3Qq': '/portfolio/gannat-ouverture.webp',
              'https://design.canva.ai/--6cLLDQoNhRnBu': '/portfolio/freshtalk-radio.webp',
              'https://design.canva.ai/--miwgxt2sx0HAC': '/portfolio/collecte-dons.webp',
              'https://design.canva.ai/FOcMHUx9A0GWptP': '/portfolio/identite-politique.webp',
          }
          for old, new in mapping.items():
              if old not in s:
                  raise SystemExit(f'Missing expected portfolio URL: {old}')
              s = s.replace(old, new)

          if 'design.canva.ai' in s or 'media.canva.com' in s:
              raise SystemExit('A remote Canva image URL remains in portfolio.tsx')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Restore temporary bridge and remove one-time files
        shell: bash
        run: |
          cat > src/routes/api/public/site-status.ts <<'EOF'
          import { createFileRoute } from "@tanstack/react-router";

          const headers = {
            "Cache-Control": "no-store",
            "Content-Type": "application/json; charset=utf-8",
          };

          /**
           * Endpoint historique conservé pour compatibilité.
           * Le site public reste toujours disponible pendant les déploiements.
           */
          export const Route = createFileRoute("/api/public/site-status")({
            server: {
              handlers: {
                GET: async () =>
                  Response.json(
                    {
                      maintenance: false,
                      reason: "maintenance-disabled",
                    },
                    { headers },
                  ),
              },
            },
          });
          EOF

          rm -f 'src/routes/api/public/portfolio-cache/$slug.ts'
          rmdir --ignore-fail-on-non-empty src/routes/api/public/portfolio-cache 2>/dev/null || true
          rm -f .github/workflows/cache-canva-portfolio.yml

      - name: Commit permanent portfolio assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/portfolio src/routes/portfolio.tsx src/routes/api/public/site-status.ts src/routes/api/public/portfolio-cache .github/workflows/cache-canva-portfolio.yml || true
          git commit -m 'fix: serve portfolio images locally'
          git push
