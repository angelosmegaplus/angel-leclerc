name: Cache Canva portfolio images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-canva-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download and convert portfolio previews
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          mkdir -p public/portfolio /tmp/portfolio

          cat > /tmp/download.py <<'PY'
          import io, os, urllib.request
          from PIL import Image

          items = {
            'logo-alc': 'https://design.canva.ai/ERnnCTPVt0CNCx3',
            'serie-logos-personnels': 'https://design.canva.ai/X8Qr31KGd7ApqsP',
            'explorations-logos': 'https://design.canva.ai/MQqG84jqqArdADA',
            'fds': 'https://design.canva.ai/-EDDkDRnp2w9V74',
            'angel-os': 'https://design.canva.ai/mynEfAulHgpDQUr',
            'firebox': 'https://design.canva.ai/Lz9aJQyPySr0wgz',
            'eclaireurs-libres': 'https://design.canva.ai/o2Y_HSWMk12cmHW',
            'tombola': 'https://design.canva.ai/sObwXgi3qa0-CRM',
            'gannat-ouverture': 'https://design.canva.ai/GH3oLueOxxXg3Qq',
            'freshtalk-radio': 'https://design.canva.ai/--6cLLDQoNhRnBu',
            'collecte-dons': 'https://design.canva.ai/--miwgxt2sx0HAC',
            'identite-politique': 'https://design.canva.ai/FOcMHUx9A0GWptP',
          }

          failures = []
          for name, url in items.items():
            try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                data = r.read()
              img = Image.open(io.BytesIO(data)).convert('RGB')
              if img.width > 1600:
                ratio = 1600 / img.width
                img = img.resize((1600, round(img.height * ratio)), Image.Resampling.LANCZOS)
              out = f'public/portfolio/{name}.webp'
              img.save(out, 'WEBP', quality=88, method=6)
              print(f'OK {name}: {img.width}x{img.height}')
            except Exception as e:
              failures.append((name, str(e)))
              print(f'FAIL {name}: {e}')

          if failures:
            print('Some downloads failed:')
            for name, err in failures:
              print(f' - {name}: {err}')
            raise SystemExit(1)
          PY

          python /tmp/download.py

      - name: Point portfolio to local files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/portfolio.tsx')
          s = p.read_text()
          mapping = {
            'https://design.canva.ai/ERnnCTPVt0CNCx3': '/portfolio/logo-alc.webp',
            'https://design.canva.ai/X8Qr31KGd7ApqsP': '/portfolio/serie-logos-personnels.webp',
            'https://design.canva.ai/MQqG84jqqArdADA': '/portfolio/explorations-logos.webp',
            'https://design.canva.ai/-EDDkDRnp2w9V74': '/portfolio/fds.webp',
            'https://design.canva.ai/mynEfAulHgpDQUr': '/portfolio/angel-os.webp',
            'https://design.canva.ai/Lz9aJQyPySr0wgz': '/portfolio/firebox.webp',
            'https://design.canva.ai/o2Y_HSWMk12cmHW': '/portfolio/eclaireurs-libres.webp',
            'https://design.canva.ai/sObwXgi3qa0-CRM': '/portfolio/tombola.webp',
            'https://design.canva.ai/GH3oLueOxxXg3Qq': '/portfolio/gannat-ouverture.webp',
            'https://design.canva.ai/--6cLLDQoNhRnBu': '/portfolio/freshtalk-radio.webp',
            'https://design.canva.ai/--miwgxt2sx0HAC': '/portfolio/collecte-dons.webp',
            'https://design.canva.ai/FOcMHUx9A0GWptP': '/portfolio/identite-politique.webp',
          }
          for old, new in mapping.items():
            if old not in s:
              raise SystemExit(f'Missing expected URL: {old}')
            s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Commit cached images
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain public/portfolio)" ]; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/portfolio src/routes/portfolio.tsx
          git commit -m 'fix: serve portfolio images locally'
          git push
