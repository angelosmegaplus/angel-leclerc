name: Observabilité Angel OS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/observability.yml"
      - "src/routes/index.tsx"
      - "src/routes/articles/**"
      - "src/routes/parcours.tsx"
      - "src/routes/contact.tsx"
      - "src/routes/api/angel-os/health.ts"
      - "src/routes/api/assistant.ts"
      - "src/lib/articles*.ts"
      - "src/lib/ai-*.server.ts"
      - "src/lib/news.functions.ts"
      - "src/lib/vercel-connect-credentials.server.ts"
      - "src/lib/system.server.ts"
      - "src/lib/tmdb.server.ts"
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: angel-os-observability
  cancel-in-progress: true

jobs:
  health:
    name: Contrôle production complet
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Probe all production dependencies
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl --silent --show-error --max-time 20 -o /tmp/health.json -w '%{http_code}' https://www.angel-leclerc.fr/api/angel-os/health)"
          if ! jq -e . /tmp/health.json >/dev/null 2>&1; then
            echo "::error::Health non JSON (HTTP=$HTTP)"
            head -c 1000 /tmp/health.json || true
            exit 1
          fi
          jq . /tmp/health.json
          FAILURES="$(jq -r '[.dependencies // {} | to_entries[] | select(.value.reachable == false) | .key + ":" + (.value.reason // "unreachable")] | join(",")' /tmp/health.json)"
          MISSING="$(jq -r '(.configuration.missing // []) | join(",")' /tmp/health.json)"
          CRITICAL="$(jq -r '[.dependencies // {} | to_entries[] | select(.key == "openai" or .key == "supabaseAuth" or .key == "supabaseServer" or .key == "tmdb") | select(.value.configured != true or .value.reachable == false) | .key + ":" + (.value.reason // "not_ready")] | join(",")' /tmp/health.json)"
          echo "http=$HTTP" >> "$GITHUB_OUTPUT"
          echo "healthy=$(jq -r '.healthy // false' /tmp/health.json)" >> "$GITHUB_OUTPUT"
          echo "release=$(jq -r '.release // empty' /tmp/health.json)" >> "$GITHUB_OUTPUT"
          echo "failures=$FAILURES" >> "$GITHUB_OUTPUT"
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          [ -z "$FAILURES" ] || echo "::warning::Dépendances en échec : $FAILURES"
          [ -z "$MISSING" ] || echo "::warning::Configuration manquante : $MISSING"

      - name: Verify public pages
        id: public_smoke
        shell: bash
        run: |
          set -euo pipefail
          check_page() {
            local name="$1" path="$2" marker="$3" file="/tmp/public-${1}.html" code
            code="$(curl --silent --show-error --location --max-time 25 -o "$file" -w '%{http_code}' "https://www.angel-leclerc.fr${path}")"
            echo "[$name] HTTP=$code path=$path"
            [[ "$code" =~ ^2 ]] || { echo "::error::[$name] HTTP=$code"; head -c 800 "$file" || true; return 1; }
            if grep -Eiq "This page didn.?t load|Something went wrong on our end|Internal Server Error|Service Unavailable|Bad Gateway" "$file"; then
              echo "::error::[$name] page d'erreur détectée malgré HTTP=$code"
              head -c 800 "$file" || true
              return 1
            fi
            grep -Fqi "$marker" "$file" || { echo "::error::[$name] contenu attendu absent: $marker"; head -c 800 "$file" || true; return 1; }
            echo "${name}_http=$code" >> "$GITHUB_OUTPUT"
          }
          check_page home / "Angel Leclerc"
          check_page articles /articles "Mes articles"
          check_page parcours /parcours "Parcours"
          check_page contact /contact "Contact"

      - name: Verify real AI conversations
        id: ai_smoke
        shell: bash
        run: |
          set -euo pipefail
          probe_ai() {
            local name="$1" payload="$2" file="/tmp/assistant-${1}.json" code text source reason
            code="$(curl --silent --show-error --max-time 40 -o "$file" -w '%{http_code}' -X POST https://www.angel-leclerc.fr/api/assistant -H 'Content-Type: application/json' --data "$payload")"
            if ! jq -e . "$file" >/dev/null 2>&1; then echo "::error::[$name] réponse non JSON HTTP=$code"; head -c 500 "$file" || true; return 1; fi
            text="$(jq -r '.text // empty' "$file")"; source="$(jq -r '.source // empty' "$file")"; reason="$(jq -r '.reason // empty' "$file")"
            echo "[$name] HTTP=$code source=$source reason=$reason"
            jq '{text,source,reason,requestId}' "$file"
            [[ "$code" =~ ^2 ]] && [ -n "$text" ] && [ "$source" = "openai" ] || return 1
            ! printf '%s' "$text" | grep -Eiq '^\s*<(html|!doctype)|^\s*\{' || return 1
            echo "${name}_http=$code" >> "$GITHUB_OUTPUT"; echo "${name}_reason=$reason" >> "$GITHUB_OUTPUT"
          }
          probe_ai site '{"question":"Réponds en une phrase très courte pour confirmer que le moteur IA fonctionne réellement.","mode":"site","history":[]}'
          probe_ai contact '{"question":"Je voudrais savoir comment prendre contact pour une demande de communication. Réponds brièvement.","mode":"contact","history":[]}'
          probe_ai context '{"question":"Quel mot t’ai-je demandé de retenir ?","mode":"site","history":[{"role":"user","content":"Retiens le mot ORION pour le prochain message."},{"role":"assistant","content":"D’accord, je retiens ORION."}]}'

      - name: Verify OpenAI news contribution
        id: news_ai
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl --silent --show-error --max-time 35 -o /tmp/news.json -w '%{http_code}' https://www.angel-leclerc.fr/api/admin/news)"
          jq -e . /tmp/news.json >/dev/null 2>&1 || { echo "::error::Veille non JSON HTTP=$HTTP"; head -c 500 /tmp/news.json || true; exit 1; }
          COUNT="$(jq '[.items[]? | select(((.id // "") | tostring) | contains("openai-web-"))] | length' /tmp/news.json)"
          TOTAL="$(jq '[.items[]?] | length' /tmp/news.json)"
          echo "http=$HTTP" >> "$GITHUB_OUTPUT"; echo "count=$COUNT" >> "$GITHUB_OUTPUT"; echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          [[ "$HTTP" =~ ^2 ]] && [ "$COUNT" -ge 1 ] || { echo "::error::Veille OpenAI absente (HTTP=$HTTP, $COUNT/$TOTAL)"; exit 1; }

      - name: Enforce core production health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CRITICAL='${{ steps.probe.outputs.critical }}'
          if [ -n "$CRITICAL" ]; then echo "::error::Dépendances critiques : $CRITICAL"; exit 1; fi
          if [ '${{ steps.probe.outputs.healthy }}' != 'true' ]; then echo "::error::Health global rouge malgré dépendances critiques disponibles"; exit 1; fi

      - name: Record production incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="[Angel OS] Journal incidents production"
          ISSUE="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --limit 1 --json number --jq '.[0].number // empty')"
          BODY="Incident observabilité · $(date -u +%FT%TZ) · release=${{ steps.probe.outputs.release }} · public=${{ steps.public_smoke.outputs.home_http }}/${{ steps.public_smoke.outputs.articles_http }}/${{ steps.public_smoke.outputs.parcours_http }}/${{ steps.public_smoke.outputs.contact_http }} · dépendances=${{ steps.probe.outputs.failures }} · manque=${{ steps.probe.outputs.missing }} · critiques=${{ steps.probe.outputs.critical }} · IA site=${{ steps.ai_smoke.outputs.site_http }}/${{ steps.ai_smoke.outputs.site_reason }} · contact=${{ steps.ai_smoke.outputs.contact_http }}/${{ steps.ai_smoke.outputs.contact_reason }} · contexte=${{ steps.ai_smoke.outputs.context_http }}/${{ steps.ai_smoke.outputs.context_reason }} · veille=${{ steps.news_ai.outputs.count }}/${{ steps.news_ai.outputs.total }} · run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$ISSUE" ]; then gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" >/dev/null; else gh issue comment --repo "$GITHUB_REPOSITORY" "$ISSUE" --body "$BODY" >/dev/null; fi

      - name: Health summary
        if: always()
        run: |
          echo "## Observabilité Angel OS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release : ${{ steps.probe.outputs.release }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health : ${{ steps.probe.outputs.healthy }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public accueil/articles/parcours/contact : ${{ steps.public_smoke.outputs.home_http }} / ${{ steps.public_smoke.outputs.articles_http }} / ${{ steps.public_smoke.outputs.parcours_http }} / ${{ steps.public_smoke.outputs.contact_http }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Échecs : ${{ steps.probe.outputs.failures }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Manquants : ${{ steps.probe.outputs.missing }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- IA site/contact/contexte : ${{ steps.ai_smoke.outputs.site_http }} / ${{ steps.ai_smoke.outputs.contact_http }} / ${{ steps.ai_smoke.outputs.context_http }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Veille OpenAI : ${{ steps.news_ai.outputs.count }}/${{ steps.news_ai.outputs.total }}" >> "$GITHUB_STEP_SUMMARY"
