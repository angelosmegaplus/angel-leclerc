name: Observabilité Angel OS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/observability.yml"
      - "src/routes/api/assistant.ts"
      - "src/lib/ai-*.server.ts"
      - "src/lib/vercel-connect-credentials.server.ts"
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: angel-os-observability
  cancel-in-progress: true

jobs:
  health:
    name: Contrôle production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Probe Angel OS production
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error --max-time 20 https://www.angel-leclerc.fr/api/angel-os/health)"
          printf '%s' "$RESPONSE" > /tmp/health.json
          jq . /tmp/health.json
          test "$(jq -r '.healthy // false' /tmp/health.json)" = "true"

          FAILURES="$(jq -r '
            [.dependencies // {} | to_entries[]
              | select(.value.configured == true and .value.reachable == false)
              | .key + ":" + (.value.reason // "unreachable")]
            | join(",")
          ' /tmp/health.json)"
          MISSING="$(jq -r '
            [.dependencies // {} | to_entries[]
              | select(.value.configured == false)
              | .key]
            | join(",")
          ' /tmp/health.json)"
          echo "failures=$FAILURES" >> "$GITHUB_OUTPUT"
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          if [ -n "$FAILURES" ]; then
            echo "::error::Dépendances configurées mais injoignables : $FAILURES"
            exit 1
          fi

      - name: Verify real AI generation in production
        id: ai_smoke
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error --max-time 40 \
            -X POST https://www.angel-leclerc.fr/api/assistant \
            -H 'Content-Type: application/json' \
            --data '{"question":"Réponds en une phrase très courte pour confirmer que le moteur IA fonctionne réellement.","mode":"site","history":[]}')"
          printf '%s' "$RESPONSE" > /tmp/assistant.json
          jq . /tmp/assistant.json

          TEXT="$(jq -r '.text // empty' /tmp/assistant.json)"
          SOURCE="$(jq -r '.source // empty' /tmp/assistant.json)"
          REASON="$(jq -r '.reason // empty' /tmp/assistant.json)"
          REQUEST_ID="$(jq -r '.requestId // empty' /tmp/assistant.json)"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

          if [ -z "$TEXT" ] || [ "$SOURCE" != "openai" ]; then
            echo "::error::L'endpoint IA n'a pas produit de réponse exploitable (source=$SOURCE, reason=$REASON, requestId=$REQUEST_ID)."
            exit 1
          fi
          if printf '%s' "$TEXT" | grep -Eiq '^\s*<(html|!doctype)|^\s*\{'; then
            echo "::error::Réponse IA invalide ou brute (requestId=$REQUEST_ID)."
            exit 1
          fi

      - name: Record production incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="[Angel OS] Journal incidents production"
          ISSUE="$(gh issue list --state open --search "$TITLE in:title" --limit 1 --json number --jq '.[0].number // empty')"
          BODY="Incident observabilité · $(date -u +%FT%TZ) · dépendances=${{ steps.probe.outputs.failures }} · ai_reason=${{ steps.ai_smoke.outputs.reason }} · ai_request=${{ steps.ai_smoke.outputs.request_id }} · run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$ISSUE" ]; then gh issue create --title "$TITLE" --body "$BODY" >/dev/null; else gh issue comment "$ISSUE" --body "$BODY" >/dev/null; fi

      - name: Health summary
        if: always()
        shell: bash
        run: |
          echo "## Observabilité Angel OS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production : https://www.angel-leclerc.fr" >> "$GITHUB_STEP_SUMMARY"
          echo "- OpenAI/TMDB : test réseau réel quand configurés" >> "$GITHUB_STEP_SUMMARY"
          echo "- IA conversationnelle : vraie génération requise, réponse vide/fallback interdite" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source IA observée : ${{ steps.ai_smoke.outputs.source }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Raison IA : ${{ steps.ai_smoke.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Configuration manquante : ${{ steps.probe.outputs.missing }}" >> "$GITHUB_STEP_SUMMARY"
