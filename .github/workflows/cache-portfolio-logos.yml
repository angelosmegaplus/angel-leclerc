name: Cache portfolio logos

on:
  push:
    branches:
      - main
    paths:
      - scripts/cache-portfolio-logos.py
      - .github/workflows/cache-portfolio-logos.yml

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Cache images
        run: |
          python -m pip install --quiet pillow
          python scripts/cache-portfolio-logos.py
      - name: Commit cached images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portfolio
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "chore: cache extra portfolio logos"
            git push
          fi
