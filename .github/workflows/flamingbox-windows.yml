name: Flamme 0.7 Windows

on:
  workflow_dispatch:
  push:
    branches: [flamme-release-0.7]
    paths:
      - 'flamingbox/**'
      - '.github/workflows/flamingbox-windows.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: flamingbox
        shell: powershell
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        working-directory: flamingbox
        shell: powershell
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          node --check src/search.js
          node --check src/services.js

      - name: Architecture guard
        working-directory: flamingbox
        shell: powershell
        run: |
          $main = Get-Content src/main.js -Raw
          if ($main -match '--no-sandbox|disable-web-security') { throw 'Unsafe Chromium flag detected' }
          if ($main -match 'Gecko|SpiderMonkey') { throw 'Second browser engine detected' }
          Write-Host 'Single Chromium runtime policy OK.'

      - name: Build portable Flamme 0.7
        working-directory: flamingbox
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win portable --x64 --publish never

      - name: Verify executable
        id: verify
        shell: powershell
        run: |
          $exe = Get-Item 'flamingbox\dist\Flamme-0.7.0-Windows-x64.exe'
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "size=$($exe.Length)" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256: $hash"

      - name: Upload Flamme 0.7 executable
        uses: actions/upload-artifact@v4
        with:
          name: Flamme-0.7.0-Windows-x64
          path: flamingbox/dist/Flamme-0.7.0-Windows-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
