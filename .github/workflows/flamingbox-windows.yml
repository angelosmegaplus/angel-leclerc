name: FlamingBox Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'flamingbox/**'
      - '.github/workflows/flamingbox-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NW.js Chromium runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.114.2'
          $url = "https://dl.nwjs.io/v$version/nwjs-v$version-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile nwjs.zip
          Expand-Archive nwjs.zip -DestinationPath runtime

      - name: Package FlamingBox
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.114.2'
          $runtime = Join-Path $PWD "runtime\nwjs-v$version-win-x64"
          $dist = Join-Path $PWD 'flamingbox-dist'
          $appZip = Join-Path $PWD 'flamingbox-app.zip'
          $appNw = Join-Path $PWD 'flamingbox-app.nw'

          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist | Out-Null

          Compress-Archive -Path 'flamingbox\package.json','flamingbox\src','flamingbox\assets' -DestinationPath $appZip -CompressionLevel Optimal
          Copy-Item $appZip $appNw
          Copy-Item "$runtime\*" $dist -Recurse -Force

          cmd /c copy /b "`"$runtime\nw.exe`"+`"$appNw`"" "`"$dist\FlamingBox.exe`""
          Remove-Item "$dist\nw.exe" -Force

          @'
          FlamingBox 0.2.0
          Chromium runtime: NW.js 0.114.2 / Chromium 151

          Lancez FlamingBox.exe.
          Les fichiers DLL et PAK présents dans ce dossier font partie du moteur Chromium et doivent rester à côté de l'exécutable.
          '@ | Set-Content "$dist\LISEZ-MOI.txt" -Encoding UTF8

          Compress-Archive -Path "$dist\*" -DestinationPath "$PWD\FlamingBox-Windows-x64.zip" -CompressionLevel Optimal

      - name: Build single-file Windows installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $PWD 'installer-work'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Copy-Item "$PWD\FlamingBox-Windows-x64.zip" "$work\payload.zip"

          @'
          @echo off
          setlocal
          set "DEST=%LOCALAPPDATA%\FlamingBox"
          if exist "%DEST%" rmdir /s /q "%DEST%"
          mkdir "%DEST%"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '%~dp0payload.zip' -DestinationPath '%DEST%' -Force"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$w=New-Object -ComObject WScript.Shell; $d=[Environment]::GetFolderPath('Desktop'); $s=$w.CreateShortcut((Join-Path $d 'FlamingBox.lnk')); $s.TargetPath=(Join-Path $env:LOCALAPPDATA 'FlamingBox\FlamingBox.exe'); $s.WorkingDirectory=(Join-Path $env:LOCALAPPDATA 'FlamingBox'); $s.Save()"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$w=New-Object -ComObject WScript.Shell; $m=Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'; $s=$w.CreateShortcut((Join-Path $m 'FlamingBox.lnk')); $s.TargetPath=(Join-Path $env:LOCALAPPDATA 'FlamingBox\FlamingBox.exe'); $s.WorkingDirectory=(Join-Path $env:LOCALAPPDATA 'FlamingBox'); $s.Save()"
          start "" "%DEST%\FlamingBox.exe"
          endlocal
          '@ | Set-Content "$work\install.cmd" -Encoding ASCII

          $target = Join-Path $PWD 'FlamingBox-Setup.exe'
          $sed = Join-Path $work 'setup.sed'
          $source = $work + '\'
          @"
          [Version]
          Class=IEXPRESS
          SEDVersion=3
          [Options]
          PackagePurpose=InstallApp
          ShowInstallProgramWindow=0
          HideExtractAnimation=1
          UseLongFileName=1
          InsideCompressed=0
          CAB_FixedSize=0
          CAB_ResvCodeSigning=0
          RebootMode=N
          InstallPrompt=
          DisplayLicense=
          FinishMessage=
          TargetName=$target
          FriendlyName=FlamingBox Setup
          AppLaunched=install.cmd
          PostInstallCmd=<None>
          AdminQuietInstCmd=install.cmd
          UserQuietInstCmd=install.cmd
          SourceFiles=SourceFiles
          [SourceFiles]
          SourceFiles0=$source
          [SourceFiles0]
          %FILE0%=
          %FILE1%=
          [Strings]
          FILE0=install.cmd
          FILE1=payload.zip
          "@ | Set-Content $sed -Encoding ASCII

          & "$env:WINDIR\System32\iexpress.exe" /N /Q $sed
          if (!(Test-Path $target)) { throw 'IExpress did not create FlamingBox-Setup.exe' }

      - name: Upload FlamingBox Windows
        uses: actions/upload-artifact@v4
        with:
          name: FlamingBox-Windows
          path: |
            FlamingBox-Setup.exe
            FlamingBox-Windows-x64.zip
            flamingbox-dist/FlamingBox.exe
          if-no-files-found: error
          compression-level: 0
