name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, build and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # TanStack Router generates src/routeTree.gen.ts during the Vite build.
      # Building first keeps CI in sync with newly added file-based routes before tsc runs.
      - name: Build production bundle
        run: bun run build

      - name: Type-check
        run: bunx tsc --noEmit --pretty false
