name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "runtime/angel-os-snapshot.json"
      - "runtime/angel-os-mail-snapshot.json"
      - "runtime/angel-os-sync-trigger.txt"
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile

      - name: Secret hygiene check
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if grep -qE '^(OPENAI_API_KEY|SUPABASE_SERVICE_ROLE_KEY|VERCEL_TOKEN|GITHUB_TOKEN|NEWSLETTER_CRON_SECRET|GOOGLE_CLIENT_SECRET|STRIPE_SECRET_KEY|SUPABASE_ACCESS_TOKEN|[A-Z0-9_]*PRIVATE_KEY|[A-Z0-9_]*PASSWORD)=' "$file"; then
              echo "::error file=$file::Variable sensible détectée dans un fichier suivi par Git"
              failed=1
            fi
          done < <(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$' || true)
          test "$failed" -eq 0

      - name: Lint
        run: bun run lint

      - name: Build production bundle and generate route types
        run: bun run build

      - name: Type-check generated application
        run: bun run typecheck

      - name: Verify generated production output
        shell: bash
        run: |
          test -d dist || test -d .output || { echo "::error::Aucun bundle de production généré"; exit 1; }

      - name: Preserve verified production artifact
        uses: actions/upload-artifact@v4
        with:
          name: angel-os-build-${{ github.sha }}
          path: |
            dist
            .output
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: CI summary
        if: always()
        run: |
          echo "## Angel OS quality gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Installation reproductible + cache Bun" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint bloquant" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build production + génération des types de routes bloquants" >> "$GITHUB_STEP_SUMMARY"
          echo "- TypeScript après génération TanStack bloquant" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hygiène des secrets sensibles bloquante" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artefact exact du SHA conservé 7 jours" >> "$GITHUB_STEP_SUMMARY"
