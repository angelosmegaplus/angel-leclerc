name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "runtime/angel-os-snapshot.json"
      - "runtime/angel-os-mail-snapshot.json"
      - "runtime/angel-os-sync-trigger.txt"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Secret hygiene check
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$'; then
            echo "::warning::Des fichiers .env historiques sont encore suivis par Git. Les nouveaux fichiers .env sont désormais ignorés et leur migration vers les secrets centralisés doit être terminée avant suppression."
          fi

      - name: Lint diagnostics (legacy debt is non-blocking)
        continue-on-error: true
        run: bun run lint

      - name: Build production bundle
        run: bun run build

      - name: Type-check
        run: bunx tsc --noEmit --pretty false

      - name: Verify generated production output
        shell: bash
        run: |
          test -d dist || test -d .output || { echo "::error::Aucun bundle de production généré"; exit 1; }

      - name: CI summary
        if: always()
        run: |
          echo "## Angel OS quality gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint exécuté en diagnostic tant que la dette historique n'est pas résorbée" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build production bloquant (détecte notamment JSX/TypeScript invalide)" >> "$GITHUB_STEP_SUMMARY"
          echo "- TypeScript bloquant" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hygiène des secrets" >> "$GITHUB_STEP_SUMMARY"
