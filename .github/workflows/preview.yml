name: Preview Angel OS

on:
  pull_request:
    branches: [main]

auto_cancel:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_V2zZ6Gj9Vt3ULjCO6ssDbqwM
  VERCEL_PROJECT_ID: prj_TZoiBkJM3z1knPE6Pc1V854CwrNe

jobs:
  preview:
    name: Build, test and preview
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Lint diagnostics
        continue-on-error: true
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Type-check
        run: bunx tsc --noEmit --pretty false

      - name: Ensure Vercel preview credentials exist
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN absent"; exit 1; }

      - name: Pull preview configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bunx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope=angel-os2

      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          URL="$(bunx vercel@latest deploy --token="$VERCEL_TOKEN" --scope=angel-os2)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke-test preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          bunx vercel@latest curl /api/angel-os/health --deployment "$DEPLOY_URL" --token="$VERCEL_TOKEN" --scope=angel-os2 --fail --silent --show-error >/dev/null

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          gh pr comment "$PR_NUMBER" --body "Preview Angel OS vérifiée : $DEPLOY_URL"
