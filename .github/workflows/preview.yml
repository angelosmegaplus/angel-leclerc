name: Preview Angel OS

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_V2zZ6Gj9Vt3ULjCO6ssDbqwM
  VERCEL_PROJECT_ID: prj_TZoiBkJM3z1knPE6Pc1V854CwrNe

jobs:
  preview:
    name: Build, test and optional preview
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Type-check
        run: bun run typecheck

      - name: Detect preview capability
        id: preview_auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Vercel preview credentials available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Vercel preview credentials are not configured; code validation remains authoritative for this PR."
          fi

      - name: Pull preview configuration
        if: steps.preview_auth.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bunx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope=angel-os2

      - name: Deploy isolated preview
        id: deploy
        if: steps.preview_auth.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          URL="$(bunx vercel@latest deploy --token="$VERCEL_TOKEN" --scope=angel-os2)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Digital-twin smoke gate
        if: steps.preview_auth.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for route in /api/angel-os/health / /parcours /articles; do
            bunx vercel@latest curl "$route" --deployment "$DEPLOY_URL" --token="$VERCEL_TOKEN" --scope=angel-os2 --fail --silent --show-error >/dev/null
          done

      - name: Comment verified preview URL
        if: steps.preview_auth.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          gh pr comment "$PR_NUMBER" --body "Digital twin Angel OS vérifié (health + accueil + parcours + articles) : $DEPLOY_URL"

      - name: Preview summary
        if: always()
        run: |
          echo "## Preview Angel OS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint/build/typecheck : obligatoires" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.preview_auth.outputs.available }}" = "true" ]; then
            echo "- Preview Vercel : active" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Preview Vercel : non configurée, sans faux échec" >> "$GITHUB_STEP_SUMMARY"
          fi
