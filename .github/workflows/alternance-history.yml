name: Historique recherche alternance

on:
  push:
    branches: [main]
    paths:
      - runtime/alternance-urgent-latest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alternance-history-main
  cancel-in-progress: false

jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge latest research into cumulative history
        run: node .github/scripts/update-alternance-history.mjs

      - name: Commit history when it changed
        run: |
          if git diff --quiet -- runtime/alternance-research-history.json; then
            echo "No history change."
            exit 0
          fi
          git config user.name "Angel OS"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/alternance-research-history.json
          git commit -m "Update alternance research history"
          git pull --rebase origin main
          git push origin main
