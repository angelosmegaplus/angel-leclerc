name: Historique recherche alternance — runtime data

on:
  push:
    branches: [runtime-data]
    paths:
      - runtime/alternance-urgent-latest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alternance-history-runtime-data
  cancel-in-progress: true

jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out runtime data branch
        uses: actions/checkout@v5
        with:
          ref: runtime-data
          fetch-depth: 1

      - name: Merge latest research into cumulative history
        run: node .github/scripts/update-alternance-history.mjs

      - name: Commit history only on runtime-data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- runtime/alternance-research-history.json; then
            echo "No history change."
            exit 0
          fi
          git config user.name "Angel OS Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/alternance-research-history.json
          git commit -m "runtime: update alternance research history"
          git pull --rebase origin runtime-data
          git push origin HEAD:runtime-data
