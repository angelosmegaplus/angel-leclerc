name: Refresh balanced portfolio images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-portfolio-images-2.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache selected Canva previews
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          mkdir -p public/portfolio
          cat > /tmp/cache.py <<'PY'
          import io, urllib.request
          from PIL import Image

