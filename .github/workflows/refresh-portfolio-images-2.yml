          }

          for name, url in items.items():
            req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
            with urllib.request.urlopen(req, timeout=30) as r:
              data = r.read()
            img = Image.open(io.BytesIO(data)).convert('RGB')
            out = f'public/portfolio/{name}.webp'
            img.save(out, 'WEBP', quality=92, method=6)
            print(name, img.size)
          PY
          python /tmp/cache.py
      - name: Commit images and remove one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-portfolio-images-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portfolio .github/workflows/refresh-portfolio-images-2.yml
          git commit -m "chore: add balanced portfolio visuals"
          git push