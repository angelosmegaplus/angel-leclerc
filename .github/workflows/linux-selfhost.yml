name: Angel OS Linux self-host validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "angel-os/platform/linux/**"
      - "angel-os/services/data/**"
      - "angel-os/services/identity/**"
      - "angel-os/adapters/data.server.ts"
      - "angel-os/adapters/identity.server.ts"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: linux-selfhost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Build Linux containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Angel OS application image
        run: docker build -f angel-os/platform/linux/Containerfile -t angel-os-linux:test .
      - name: Build Angel Data image
        run: docker build -f angel-os/services/data/Containerfile -t angel-data:test .
      - name: Build Angel Identity image
        run: docker build -f angel-os/platform/linux/IdentityContainerfile -t angel-identity:test .
      - name: Inspect images
        run: |
          docker image inspect angel-os-linux:test --format '{{.Id}} {{.Size}}'
          docker image inspect angel-data:test --format '{{.Id}} {{.Size}}'
          docker image inspect angel-identity:test --format '{{.Id}} {{.Size}}'

  quadlet:
    name: Validate Linux service files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -s angel-os/platform/linux/Caddyfile
          test -s angel-os/platform/linux/env.example
          test -x angel-os/platform/linux/scripts/install.sh
          test -x angel-os/platform/linux/scripts/backup.sh
          test -s angel-os/platform/linux/quadlet/angel-data.container
          test -s angel-os/platform/linux/quadlet/angel-identity.container
          test -s angel-os/services/data/server.ts
          test -s angel-os/services/identity/server.ts
          for f in angel-os/platform/linux/quadlet/*; do test -s "$f"; done
          for f in angel-os/platform/linux/systemd/*; do test -s "$f"; done
