name: Synchronisation données Angel OS

on:
  push:
    branches: [main]
    paths:
      - "runtime/angel-os-snapshot.json"
      - "runtime/angel-os-mail-snapshot.json"
      - "runtime/angel-os-sync-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angel-os-data-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      NEWSLETTER_CRON_SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Choisir le snapshot à synchroniser
        shell: bash
        run: |
          SNAPSHOT_FILE="runtime/angel-os-snapshot.json"
          if [ "${{ github.event_name }}" = "push" ] && [ -f "runtime/angel-os-mail-snapshot.json" ]; then
            CHANGED_FILES="$(jq -r '[(.head_commit.added // []), (.head_commit.modified // [])] | add[]?' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
            if printf '%s\n' "$CHANGED_FILES" | grep -Fxq "runtime/angel-os-mail-snapshot.json"; then SNAPSHOT_FILE="runtime/angel-os-mail-snapshot.json"; fi
          fi
          echo "snapshot_file=$SNAPSHOT_FILE" >> "$GITHUB_ENV"

      - name: Vérifier les secrets de synchronisation
        shell: bash
        run: |
          test -n "${SUPABASE_URL:-}" || { echo "::error::SUPABASE_URL absent des secrets GitHub"; exit 1; }
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && [ -z "${SUPABASE_SECRET_KEY:-}" ] && [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::Aucune clé Supabase disponible dans les secrets GitHub"
            exit 1
          fi
          echo "Configuration chargée uniquement depuis les secrets GitHub ; aucun fichier .env n'est sourcé."

      - name: Synchroniser les caches Angel OS directement vers Supabase
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const snapshot = JSON.parse(fs.readFileSync(process.env.snapshot_file || 'runtime/angel-os-snapshot.json', 'utf8'));
          const base = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY || process.env.SUPABASE_SECRET_KEY || process.env.SUPABASE_PUBLISHABLE_KEY;
          const privileged = Boolean(process.env.SUPABASE_SERVICE_ROLE_KEY || process.env.SUPABASE_SECRET_KEY);
          const headers = { apikey: key, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' };
          if (!key.startsWith('sb_secret_') && !key.startsWith('sb_publishable_')) headers.Authorization = `Bearer ${key}`;
          async function request(path, options = {}) {
            const response = await fetch(`${base.replace(/\/$/, '')}/rest/v1/${path}`, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            const text = await response.text();
            if (!response.ok) throw new Error(`${path}: HTTP ${response.status} ${text.slice(0, 500)}`);
            return text;
          }
          (async () => {
            const now = snapshot.fetchedAt || new Date().toISOString();
            const rows = Object.entries(snapshot.caches || {}).map(([cacheKey, payload]) => ({ key: cacheKey, payload, updated_at: payload?.fetchedAt || now }));
            if (rows.length) await request('angel_os_cache?on_conflict=key', { method: 'POST', body: JSON.stringify(rows) });
            if (snapshot.hourly_mail_report) await request('hourly_mail_reports', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(snapshot.hourly_mail_report) });
            console.log(`Synchronisation terminée (${privileged ? 'privileged key' : 'publishable key'})`);
          })().catch((error) => { console.error(error.message); process.exit(1); });
          NODE

      - name: Publier la revue quotidienne si elle n’existe pas encore
        continue-on-error: true
        if: env.snapshot_file == 'runtime/angel-os-snapshot.json'
        shell: bash
        run: |
          if [ -z "${NEWSLETTER_CRON_SECRET:-}" ]; then echo "NEWSLETTER_CRON_SECRET absent : revue quotidienne non déclenchée"; exit 0; fi
          curl --fail --silent --show-error --max-time 90 -X POST -H "x-cron-token: ${NEWSLETTER_CRON_SECRET}" -H "Content-Type: application/json" https://www.angel-leclerc.fr/api/public/hooks/daily-article

      - name: Résumé
        if: always()
        run: |
          echo "## Synchronisation Angel OS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source : ${snapshot_file:-runtime/angel-os-snapshot.json}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Voie : GitHub Actions → Supabase direct" >> "$GITHUB_STEP_SUMMARY"
          echo "- Secrets : GitHub Environments uniquement" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lovable : non utilisé" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vercel : non requis pour l’écriture des caches" >> "$GITHUB_STEP_SUMMARY"
