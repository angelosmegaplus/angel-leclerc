name: Maintenance Angel OS · Films et séries

on:
  workflow_dispatch:
  schedule:
    - cron: "46 * * * *"
  pull_request:
    paths:
      - "src/routes/admin-movix**"
      - "src/lib/film-**"
      - "src/components/admin/MovieArtwork.tsx"
      - "scripts/check-film-fallback.mjs"
      - ".github/workflows/film-fallback-maintenance.yml"

permissions:
  contents: read

concurrency:
  group: maintenance-films-series-${{ github.ref }}
  cancel-in-progress: true

jobs:
  film-fallback:
    name: Contrôler le secours cinéma interne
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Vérifier catalogue, affiches, synopsis et disponibilités
        run: node scripts/check-film-fallback.mjs
      - name: Installer les dépendances
        run: bun install --frozen-lockfile
      - name: Construire l'application
        run: bun run build
      - name: Vérifier TypeScript
        run: bun run typecheck
      - name: Résumé
        if: always()
        run: |
          {
            echo "## Films & séries — maintenance"
            echo ""
            echo "- catalogue local de secours contrôlé"
            echo "- cache interne des affiches contrôlé"
            echo "- secours d'affiche indépendant de TMDB contrôlé"
            echo "- synopsis complet et fiches détaillées contrôlés"
            echo "- disponibilité France / fournisseurs contrôlés"
            echo "- build + TypeScript exécutés dans l'ordre qui régénère le route tree"
          } >> "$GITHUB_STEP_SUMMARY"
