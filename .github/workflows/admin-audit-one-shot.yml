name: Admin audit one-shot fixes

on:
  push:
    branches: [angel-admin-polish]

permissions:
  contents: write

concurrency:
  group: admin-audit-one-shot
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: angel-admin-polish
          fetch-depth: 0
      - name: Apply final mechanical admin fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          summary = Path('src/components/admin/AdminAutomationSummary.tsx')
          text = summary.read_text()
          text = text.replace('const today = new Date().toISOString().slice(0, 10);', 'const now = new Date();\n  const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;')
          text = text.replace('rounded-[2rem] border border-border bg-card p-4 shadow-sm sm:p-6', 'rounded-[1.5rem] border border-white/10 bg-[#090b0d] p-4 shadow-[0_18px_60px_rgba(0,0,0,.24)] sm:rounded-[1.75rem] sm:p-6')
          text = text.replace('rounded-full bg-[#e8def8] text-[#594b66]', 'rounded-xl border border-red-500/20 bg-red-500/10 text-red-300')
          text = text.replace('{aiSummary.source === "openai" ? "OpenAI" : "secours local"}', '{aiSummary.source === "openai" ? "OpenAI" : "IA indisponible"}')
          summary.write_text(text)

          mailbox = Path('src/components/MailboxAdmin.tsx')
          text = mailbox.read_text()
          start = text.find('  if (!connected) {')
          end = text.find('\n  return (', start)
          if start == -1 or end == -1:
              raise SystemExit('Mailbox disconnected state not found')
          replacement = '''  if (!connected) {
    const missing = statusQuery.data?.missing ?? [];
    return (
      <div className="rounded-[1.5rem] border border-amber-500/20 bg-amber-500/[.06] p-4 sm:p-6">
        <div className="flex items-start gap-3">
          <span className="grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-amber-500/20 bg-amber-500/10 text-amber-300"><Mail className="h-5 w-5" /></span>
          <div className="min-w-0">
            <h3 className="text-base font-semibold text-white">Gmail indisponible</h3>
            <p className="mt-1 text-sm leading-relaxed text-white/50">Angel OS n’affiche aucun faux message : la boîte reste vide tant que le serveur ne confirme pas une connexion Gmail exploitable.</p>
            {missing.length > 0 ? <p className="mt-3 rounded-xl border border-white/10 bg-black/20 px-3 py-2 font-mono text-xs text-amber-200/80">Problème détecté : {missing.join(", ")}</p> : null}
          </div>
        </div>
      </div>
    );
  }
'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('className={`inline-flex min-h-9 items-center', 'className={`inline-flex min-h-10 items-center')
          text = text.replace('variant="outline"\n            size="sm"', 'variant="outline"\n            size="sm"\n            className="min-h-11"', 1)
          text = text.replace('<Button size="sm" onClick={() => setCompose({ to: "", subject: "", body: "" })}>', '<Button size="sm" className="min-h-11" onClick={() => setCompose({ to: "", subject: "", body: "" })}>', 1)
          mailbox.write_text(text)
          PY
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Angel OS'
          git config user.email 'angelleclerc2006@gmail.com'
          git add src/components/admin/AdminAutomationSummary.tsx src/components/MailboxAdmin.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'polish(admin): clean summaries and mailbox states'
          git push origin HEAD:angel-admin-polish
