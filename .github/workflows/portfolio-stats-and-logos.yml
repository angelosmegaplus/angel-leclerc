name: Refresh portfolio stats and logos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portfolio-stats-and-logos.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Cache extra Canva logos
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          mkdir -p public/portfolio
          cat > /tmp/cache_logos.py <<'PY'
          import io, urllib.request
          from PIL import Image

          items = {
            'logo-lclrc': 'https://media.canva.com/v2/document-image/hash:-1973684434/height:447/id:DAGPCPCdHvs/type:B/width:447?brand=BAE8qOCilJM&csig=AAAAAAAAAAAAAAAAAAAAAOS5FtUJbKxLJ_e7HXtLTM7_E7MJmErRGCwLcCi6tioz&disableexport=T&exp=1787773137&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FCdHvs%2FDAGPCPCdHvs%2F53%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260826%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260826T023833Z%26X-Amz-Expires%3D61224%26X-Amz-Signature%3Db31f05bdb873d3bc8439e0c4b9a0e17b9e3ddc610782073f34207ea9a1935031%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252026%2520Aug%25202026%252019%253A38%253A57%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAMTX7JuQ8DPSxFZriSnBO01vMW2P7_9Ig8oOAHPwe9CU&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=54',
            'logo-typographique': 'https://media.canva.com/v2/document-image/hash:-1557240436/height:447/id:DAGxw5rpDr8/type:B/width:447?brand=BAE8qOCilJM&csig=AAAAAAAAAAAAAAAAAAAAANGxjelHQA2G3feHlfAeNAyg5FhpU_J79B3_vmxOVqpz&disableexport=T&exp=1787773143&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FrpDr8%2FDAGxw5rpDr8%2F7%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260825%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260825T215335Z%26X-Amz-Expires%3D78328%26X-Amz-Signature%3D7963eb288d715ee7f9058a8192734b529271e6eeb6a0a47988b901b4f647df89%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252026%2520Aug%25202026%252019%253A39%253A03%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAANDyqdGTYodbN7TAVFtIqRPVm2jMI-lOeuupUpVWvq7v&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=7',
            'logo-volt': 'https://media.canva.com/v2/document-image/hash:-1833120948/height:447/id:DAGUkwdG3fw/type:B/width:447?brand=BAE8qOCilJM&csig=AAAAAAAAAAAAAAAAAAAAAKCVxWzM_CVATme1K0GafQ-6Av9M_rkr2DCm7DVucJEI&disableexport=T&exp=1787773149&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FdG3fw%2FDAGUkwdG3fw%2F3%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260826%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260826T053054Z%26X-Amz-Expires%3D50895%26X-Amz-Signature%3D2709165eccbf5365520b21abd0e24a7b9b2594773745034aaf81688607c139b0%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252026%2520Aug%25202026%252019%253A39%253A09%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAADEq4sJHd93bvco8EbXbXwn5d7NOoYlBK3ptayN6MyYR&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=3',
            'logo-video': 'https://media.canva.com/v2/document-image/hash:1648127491/height:335/id:DAGBXELOBLw/type:B/width:595?brand=BAE8qOCilJM&csig=AAAAAAAAAAAAAAAAAAAAAOQG2nvmJSJ2dZyKm0TA-suKcXl0h2_B5U7nHYsf8Tuy&disableexport=T&exp=1787773157&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FLOBLw%2FDAGBXELOBLw%2F15%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260826%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260826T102443Z%26X-Amz-Expires%3D33274%26X-Amz-Signature%3D446823e97053b0a1503db70e8a935614863fae940a61c3efbee76a518fa0009f%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252026%2520Aug%25202026%252019%253A39%253A17%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAALCyZV-I_PQD0faHHSFaRoYnJifttcTQ2QBrfOSf4Z5m&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=19',
            'logo-radiofiable': 'https://media.canva.com/v2/document-image/hash:-980593847/height:447/id:DAGGOE4YNj4/type:B/width:447?brand=BAE8qOCilJM&csig=AAAAAAAAAAAAAAAAAAAAANeHPzj2G6aUNfWH6L2Oph5c4Z27G4r2cMjLoiBa6LJI&disableexport=T&exp=1787773283&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2F4YNj4%2FDAGGOE4YNj4%2F4%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260826%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260826T154244Z%26X-Amz-Expires%3D14319%26X-Amz-Signature%3D4690320a550e031ff108ff0a2f8e6a3e57a15cc2e5ec4e5284504c365b4ea15b%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252026%2520Aug%25202026%252019%253A41%253A23%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAP6OMQHAIY3P_s_zqLVCUEtuG5J4OnuU1nehIPfJ4D8t&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=4',
            'logo-radio-ancien': 'https://media.canva.com/v2/document-image/hash:1982897319/height:447/id:DAGItACO2F8/type:B/width:447?brand=BAE8qOCilJM&csig=AAAAAAAAAAAAAAAAAAAAAFQJQ14Oi1GJ6JeM_NYphap6PktFnx9M3AVwCD_kj29T&disableexport=T&exp=1787773288&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FCO2F8%2FDAGItACO2F8%2F12%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260826%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260826T022208Z%26X-Amz-Expires%3D62360%26X-Amz-Signature%3D7afa115b66cf33d02fab254fcd901f0bc329ad641bf2ea985e4518147cf0d13b%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252026%2520Aug%25202026%252019%253A41%253A28%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAADUEj2zUQz4JY11mTgwKVvUhF1EVH_TI7T-mL7k_TJJS&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=12',
          }

          for name, url in items.items():
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()
              img = Image.open(io.BytesIO(data)).convert('RGB')
              if img.width > 1200:
                  ratio = 1200 / img.width
                  img = img.resize((1200, round(img.height * ratio)), Image.Resampling.LANCZOS)
              img.save(f'public/portfolio/{name}.webp', 'WEBP', quality=90, method=6)
              print(name, img.size)
          PY
          python /tmp/cache_logos.py

      - name: Update portfolio copy and entry points
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          portfolio = Path('src/routes/portfolio.tsx')
          s = portfolio.read_text()

          # Remove ambiguous / overly specific items from the public selection.
          for title in ['Identité personnelle — exploration', 'Série de logos', 'FdS']:
              pattern = rf'  \{{\n    title: "{re.escape(title)}",\n.*?\n  \}},\n'
              s = re.sub(pattern, '', s, count=1, flags=re.S)

          # Add a broader neutral logo selection.
          anchor = '  {\n    title: "Flyers Renard Noir",'
          new_logos = '''  {
            title: "Logo LCLRC",
            category: "Logos & identités",
            description: "Recherche typographique autour d’un monogramme personnel.",
            image: "/portfolio/logo-lclrc.webp",
            aspect: "aspect-square",
          },
          {
            title: "Identité typographique",
            category: "Logos & identités",
            description: "Essai minimaliste autour des initiales, du contraste et de la lisibilité.",
            image: "/portfolio/logo-typographique.webp",
            aspect: "aspect-square",
          },
          {
            title: "Volt",
            category: "Logos & identités",
            description: "Exploration de logo court et énergique pour un univers de marque fictif.",
            image: "/portfolio/logo-volt.webp",
            aspect: "aspect-square",
          },
          {
            title: "Logo vidéo — Angel Leclerc",
            category: "Logos & identités",
            description: "Identité pensée pour une signature vidéo et des contenus animés.",
            image: "/portfolio/logo-video.webp",
            aspect: "aspect-[16/9]",
          },
          {
            title: "RadioFiable",
            category: "Logos & identités",
            description: "Ancienne recherche de logo pour un projet radio.",
            image: "/portfolio/logo-radiofiable.webp",
            aspect: "aspect-square",
          },
          {
            title: "Logo radio — archive",
            category: "Logos & identités",
            description: "Une ancienne identité radio conservée pour montrer l’évolution de mes recherches graphiques.",
            image: "/portfolio/logo-radio-ancien.webp",
            aspect: "aspect-square",
          },
'''
          if 'title: "Logo LCLRC"' not in s:
              s = s.replace(anchor, new_logos + anchor, 1)

          old_intro = '''          <p className="mt-3 max-w-2xl text-sm leading-relaxed text-muted-foreground">
            La sélection mélange volontairement communication, radio, tourisme, événementiel, projets personnels et quelques réalisations associatives. Certaines ont servi à de vrais projets, d’autres sont des recherches graphiques faites simplement pour créer.
          </p>'''
          new_intro = '''          <p className="mt-3 max-w-2xl text-sm leading-relaxed text-muted-foreground">
            Cette page montre seulement un échantillon : logos, affiches, réseaux sociaux, radio, tourisme, événementiel et supports professionnels. J’évite volontairement les essais trop ambigus ou les expérimentations qui n’ont pas vocation à représenter mon travail public.
          </p>'''
          s = s.replace(old_intro, new_intro, 1)

          section_anchor = '''      <section className="container-tight py-9 md:py-12">
        <div className="rounded-[1.6rem] border border-border bg-card p-5 shadow-sm sm:p-7">'''
          stat_block = '''      <section className="container-tight py-9 md:py-12">
        <div data-canva-highlight="true" className="relative overflow-hidden rounded-[1.8rem] bg-[#172638] p-6 text-[#FFFDF9] shadow-lg sm:p-8">
          <div aria-hidden className="absolute -right-16 -top-16 h-52 w-52 rounded-full bg-[#CE654B]/25 blur-3xl" />
          <div className="relative flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <p className="text-xs font-semibold uppercase tracking-[0.18em] text-[#CE654B]">Canva depuis avril 2022</p>
              <div className="mt-2 flex items-baseline gap-3">
                <span className="font-display text-6xl font-bold leading-none sm:text-7xl">950</span>
                <span className="max-w-40 text-lg font-semibold leading-tight text-white/90">créations recensées</span>
              </div>
            </div>
            <div className="text-sm leading-relaxed text-white/70 sm:max-w-xs sm:text-right">
              ≈ 18 créations par mois · environ une création tous les 1,7 jour.
            </div>
          </div>
        </div>

        <div className="mt-5 rounded-[1.6rem] border border-border bg-card p-5 shadow-sm sm:p-7">'''
          if 'data-canva-highlight="true"' not in s:
              s = s.replace(section_anchor, stat_block, 1)

          s = s.replace('Canva en chiffres</p>', 'Détail du compteur</p>', 1)
          s = s.replace('{canvaStats.total} créations recensées depuis avril 2022</p>', 'Voir le rythme et les moyennes</p>', 1)

          detail_anchor = '''        </details>

        <div className="mt-8 flex gap-2 overflow-x-auto pb-2 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">'''
          note = '''        </details>

        <div className="mt-5 rounded-[1.4rem] border border-primary/20 bg-primary/5 p-5 sm:p-6">
          <p className="text-xs font-semibold uppercase tracking-[0.16em] text-primary">Une sélection, pas un catalogue parfait</p>
          <p className="mt-2 text-sm leading-relaxed text-muted-foreground">
            Dans mes 950 créations, il y a de tout : des brouillons, des essais faits sur une impulsion, des idées abandonnées et des visuels sur lesquels je peux passer une ou deux heures juste pour ajuster un détail. Cette galerie montre seulement quelques exemples. Pour voir des créations vraiment proches de votre projet ou de votre univers, le plus simple est de m’écrire directement.
          </p>
          <a href="/contact" className="mt-4 inline-flex items-center gap-2 rounded-full bg-primary px-4 py-2 text-sm font-semibold text-primary-foreground transition-opacity hover:opacity-90">Me demander des exemples <ArrowRight size={15} /></a>
        </div>

        <div className="mt-8 flex gap-2 overflow-x-auto pb-2 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">'''
          if 'Une sélection, pas un catalogue parfait' not in s:
              s = s.replace(detail_anchor, note, 1)

          portfolio.write_text(s)

          # Parcours: make the creations card the real gateway to the portfolio and surface the Canva volume.
          unified = Path('src/components/UnifiedExperiencesPortfolio.tsx')
          u = unified.read_text()
          normalized_pattern = re.compile(r'  const normalized = source\.map\(\(project\) =>\n.*?\n  \);\n\n  const cleaned', re.S)
          normalized_replacement = '''  const normalized = source.map((project) =>
            project.title === "Créations graphiques et projets associatifs"
              ? {
                  ...project,
                  context: "Missions ponctuelles de création de supports pour des projets personnels, professionnels et associatifs.",
                  missions: [
                    "Affiches, flyers et publications pour les réseaux sociaux",
                    "Logos et identités visuelles simples",
                    "Documents de présentation et supports numériques",
                  ],
                  tools: "Canva · 950 créations recensées depuis avril 2022",
                  results: "Des supports homogènes et réutilisables, adaptés à chaque public et à chaque format.",
                  href: "/portfolio",
                  linkLabel: "Voir le portfolio créatif",
                }
              : project,
          );

          const cleaned'''
          u = normalized_pattern.sub(normalized_replacement, u, count=1)

          context_line = '<p className="mt-4 text-sm leading-relaxed text-muted-foreground">{project.context}</p>'
          context_plus_stat = '''<p className="mt-4 text-sm leading-relaxed text-muted-foreground">{project.context}</p>
                {project.title === "Créations graphiques et projets associatifs" && (
                  <a href="/portfolio" className="mt-4 flex items-center gap-3 rounded-2xl border border-primary/20 bg-primary/5 px-4 py-3 transition-colors hover:bg-primary/10">
                    <span className="font-display text-3xl font-bold leading-none text-primary">950</span>
                    <span className="text-xs font-semibold leading-snug text-foreground">créations Canva recensées<br />depuis avril 2022</span>
                  </a>
                )}'''
          if '950</span>' not in u:
              u = u.replace(context_line, context_plus_stat, 1)
          unified.write_text(u)

          # Enterprise: the Portfolio card goes directly to the creative portfolio and carries the Canva proof point.
          enterprise = Path('src/routes/entreprise.tsx')
          e = enterprise.read_text()
          old_card = '''  {
            icon: FolderOpen,
            eyebrow: "Portfolio",
            title: "Mes réalisations",
            text: "Découvrez des projets concrets, les missions réalisées et les résultats obtenus.",
            href: "/parcours#realisations",
            cta: "Voir les réalisations",
          },'''
          new_card = '''  {
            icon: FolderOpen,
            eyebrow: "Portfolio créatif",
            title: "Mes créations graphiques",
            text: "950 créations Canva recensées depuis avril 2022 : logos, affiches, publications, identités visuelles et supports numériques.",
            href: "/portfolio",
            cta: "Voir le portfolio",
          },'''
          e = e.replace(old_card, new_card, 1)
          enterprise.write_text(e)
          PY
          python /tmp/patch.py

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/portfolio-stats-and-logos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/portfolio.tsx src/components/UnifiedExperiencesPortfolio.tsx src/routes/entreprise.tsx public/portfolio .github/workflows/portfolio-stats-and-logos.yml
          git commit -m "feat: highlight Canva volume and expand portfolio logos"
          git push
