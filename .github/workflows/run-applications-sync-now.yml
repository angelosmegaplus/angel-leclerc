name: Synchroniser candidatures maintenant

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-applications-sync-now.yml"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
    steps:
      - name: Synchroniser Gmail vers Candidatures
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET:-}" || { echo "::error::NEWSLETTER_CRON_SECRET absent"; exit 1; }
          tmp="$(mktemp)"
          code="$(curl -L --silent --show-error --output "$tmp" --write-out '%{http_code}' --max-time 120 \
            -X POST \
            -H "x-cron-token: ${CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            'https://www.angel-leclerc.fr/api/public/hooks/applications-sync')"
          cat "$tmp"
          test "$code" = "200" || { echo "::error::Synchronisation candidatures HTTP $code"; exit 1; }
          jq -e '.ok == true' "$tmp" >/dev/null || { echo "::error::La synchronisation a renvoyé ok=false"; exit 1; }
