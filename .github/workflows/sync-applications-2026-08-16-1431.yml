name: Sync candidatures 2026-08-16 14h31

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-applications-2026-08-16-1431.yml"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Apply verified candidature updates
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "::error::SUPABASE_URL absent"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY absent"; exit 1; }
          node <<'NODE'
          const base = process.env.SUPABASE_URL.replace(/\/$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const headers = {
            apikey: key,
            Authorization: `Bearer ${key}`,
            'Content-Type': 'application/json',
            Prefer: 'return=representation',
          };
          async function req(path, options={}) {
            const r = await fetch(`${base}/rest/v1/${path}`, { ...options, headers: { ...headers, ...(options.headers||{}) } });
            const text = await r.text();
            if (!r.ok) throw new Error(`${path}: HTTP ${r.status} ${text.slice(0,800)}`);
            return text ? JSON.parse(text) : null;
          }
          async function findByEmail(email) {
            return await req(`applications?select=*&email=eq.${encodeURIComponent(email)}&order=sent_at.desc&limit=1`);
          }
          async function upsertByEmail(email, row) {
            const found = await findByEmail(email);
            if (found?.length) {
              const id = found[0].id;
              await req(`applications?id=eq.${encodeURIComponent(id)}`, { method:'PATCH', body: JSON.stringify(row) });
              console.log('updated', email, id);
              return;
            }
            const inserted = await req('applications', { method:'POST', body: JSON.stringify({ email, ...row }) });
            console.log('inserted', email, inserted?.[0]?.id || 'ok');
          }
          (async () => {
            await upsertByEmail('info@sarlmaxima.com', {
              company: 'SARL Maxima',
              city: 'Sarlat-la-Canéda',
              position: 'Alternance BTS Communication',
              status: 'relance',
              sent_at: '2026-07-30',
              follow_up_at: null,
              response: null,
              notes: 'Relance de rattrapage unique envoyée le 16/08/2026 à 14:31 après lecture du fil Gmail complet. Adresse info@sarlmaxima.com revérifiée sur le site officiel le 16/08/2026. Ne pas relancer automatiquement une seconde fois.'
            });

            await upsertByEmail('contact@negocom-atlantique.com', {
              company: 'Negocom Atlantique',
              city: 'Périgueux',
              position: 'Action manuelle — Contrat d’apprentissage Web Marketing',
              status: 'peut_etre',
              sent_at: '2026-08-16',
              follow_up_at: null,
              response: 'Piste directe vérifiée sur le site officiel : apprentissage en Web Marketing, missions inbound/outbound, réseaux sociaux, web et tourisme. La page de recrutement demande explicitement CV + lettre de motivation : aucun envoi automatique sans CV. Action manuelle requise.',
              notes: 'Source officielle vérifiée le 16/08/2026 : https://www.negocom-atlantique.com/fr/rejoignez-nous/. Contact public actuel : contact@negocom-atlantique.com. Aucun doublon trouvé dans Gmail.'
            });
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
