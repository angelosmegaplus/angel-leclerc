name: Refresh graphic portfolio images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-portfolio-images.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Cache selected Canva previews
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          mkdir -p public/portfolio
          cat > /tmp/cache.py <<'PY'
          import io, urllib.request
          from PIL import Image

          items = {
            'logo-alc': 'https://media.canva.com/v2/document-image/hash:1184351037/height:335/id:DAHO-bA0GOM/type:B/width:595?brand=BAE8qOCilJM&csig=AAAAAAAAAAAAAAAAAAAAAFTWlLQX_xtk1vFekcDsw5p8p5heV2LP1GSZokseHNO7&disableexport=T&exp=1787770999&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FA0GOM%2FDAHO-bA0GOM%2F12%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260826%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260826T130944Z%26X-Amz-Expires%3D21215%26X-Amz-Signature%3Dbc2f6d132af65994998359e50546e1458a9f3f60ccb84e62bb94ba61fd702fdd%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252026%2520Aug%25202026%252019%253A03%253A19%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAIMTqrMfUDpehdmsWhoHbb-36q5HCD5V7WuxyFZ0kKFT&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=12',
            'collecte-dons': 'https://media.canva.com/v2/document-image/hash:1429161758/height:531/id:DAHGiwRmglA/type:B/width:376?brand=BAE8qOCilJM&csig=AAAAAAAAAAAAAAAAAAAAAEVSqodCcDphK1AVmz3dhtpgxKlD8BrHpex5j0abXhO0&disableexport=T&exp=1787771004&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FRmglA%2FDAHGiwRmglA%2F49%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260826%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260826T140104Z%26X-Amz-Expires%3D18140%26X-Amz-Signature%3D15758899f06093c780f83de874fbfe700fa47a7ef1908d129a2ce5ce3175dde7%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252026%2520Aug%25202026%252019%253A03%253A24%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAJvXF1_a7iZik5avqe90I_aqQciv7xtkqYur0XE9okln&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=49',
            'freshtalk-radio': 'https://media.canva.com/v2/document-image/hash:264916610/height:500/id:DAHCISlo5N4/type:B/width:400?brand=BAE8qOCilJM&csig=AAAAAAAAAAAAAAAAAAAAAKFm59DfzYKxElFr5NpcM_deEW_bTS172_mhOa1zZyAb&disableexport=T&exp=1787771008&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2Flo5N4%2FDAHCISlo5N4%2F55%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260826%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260826T141601Z%26X-Amz-Expires%3D17247%26X-Amz-Signature%3Da3223f98421baeb5c36c981f5ba9a7bd14a66930f7eb8ad996e4adb86c468691%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252026%2520Aug%25202026%252019%253A03%253A28%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAGtPzzAtIyp2UpXrLJY-tQw2yePwefns8cpZCyBrPiDK&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=55',
            'flyer-renard-noir': 'https://media.canva.com/v2/document-image/hash:2015260618/height:532/id:DAGL2_w-etU/type:B/width:376?brand=BAE8qOCilJM&csig=AAAAAAAAAAAAAAAAAAAAALTlLffDm5XJUIU7Z_RBVFk_7OLnEEpM18vh9n22gjfY&disableexport=T&exp=1787771013&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2Fw-etU%2FDAGL2_w-etU%2F126%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260825%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260825T194002Z%26X-Amz-Expires%3D84211%26X-Amz-Signature%3D19abddf120da7cb6dfa4fc4af1498a5c43b732af38dfcce52d86d09c05bce004%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252026%2520Aug%25202026%252019%253A03%253A33%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAGrTuaQENjbt12RGJR_KTBqB1OpfdHDQKGlT87NliDef&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=126',
            'ramassage-dechets': 'https://media.canva.com/v2/document-image/hash:937386147/height:532/id:DAGhg-Zaft0/type:B/width:376?brand=BAE8qOCilJM&csig=AAAAAAAAAAAAAAAAAAAAAGacYIf7rKKL6ltxgwRWO3UZ7qscH8HJ91aJG7UaRuoL&disableexport=T&exp=1787771017&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FZaft0%2FDAGhg-Zaft0%2F6%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260826%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260826T023821Z%26X-Amz-Expires%3D59116%26X-Amz-Signature%3D5cd9a39121a4404e3e9561c0cbcc81fc3afa9fbf7341d2b71f7e8a0b15f629a2%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252026%2520Aug%25202026%252019%253A03%253A37%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAPlo7m9pQQwX9DOVisZTyXrQIyyY5lP3ajgrKJNcxG_g&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=6',
            'livret-partenaire': 'https://media.canva.com/v2/document-image/hash:-683561995/height:538/id:DAGO8Fa12p8/type:B/width:371?brand=BAE8qOCilJM&csig=AAAAAAAAAAAAAAAAAAAAAEsi1GtzCJHqSorXK9-uXJM1isn1tSXOvEf7wpZ1E5me&disableexport=T&exp=1787771024&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2Fa12p8%2FDAGO8Fa12p8%2F171%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260826%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260826T052741Z%26X-Amz-Expires%3D48963%26X-Amz-Signature%3D6c51a74a7f8f3a3e748cee530e2441da4325993b80e1c8aaa6b9475859190661%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252026%2520Aug%25202026%252019%253A03%253A44%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAFXZc7eWnIf8f10FNb4HKQAghgbVilI_X29-UD-qHHBx&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=172',
            'modele-post-alc': 'https://media.canva.com/v2/document-image/hash:-848119224/height:500/id:DAHS-_itnaM/type:B/width:400?brand=BAE8qOCilJM&csig=AAAAAAAAAAAAAAAAAAAAAL_41ghMw4Jd8K4xcxXNFl-LU0mUYNoKlH0qXLxTTZLt&disableexport=T&exp=1787771028&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FitnaM%2FDAHS-_itnaM%2F7%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260825%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260825T195559Z%26X-Amz-Expires%3D83269%26X-Amz-Signature%3D16425d7d6d9a816f1b640221d5e7bdeaf8fe9ead948677fc8a028a6d01b0baa1%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252026%2520Aug%25202026%252019%253A03%253A48%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAOHBYMAOhpYPVUFTmWMRXdp3dUVcP5lB3rBOhn_UqK4K&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=8',
          }

          for name, url in items.items():
            req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
            with urllib.request.urlopen(req, timeout=30) as r:
              data = r.read()
            img = Image.open(io.BytesIO(data)).convert('RGB')
            out = f'public/portfolio/{name}.webp'
            img.save(out, 'WEBP', quality=90, method=6)
            print(f'{name}: {img.width}x{img.height}')
          PY
          python /tmp/cache.py

      - name: Commit images and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/refresh-portfolio-images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/portfolio .github/workflows/refresh-portfolio-images.yml
          git commit -m 'fix: replace weak portfolio previews'
          git push
