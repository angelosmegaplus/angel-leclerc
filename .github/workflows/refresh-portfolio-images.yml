name: Refresh graphic portfolio images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-portfolio-images.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Cache selected Canva previews
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          mkdir -p public/portfolio
          cat > /tmp/cache.py <<'PY'
          import io, urllib.request
          from PIL import Image

          items = {
            'logo-alc': 'https://design.canva.ai/qn0eeN1kgULA_uE',
            'collecte-dons': 'https://design.canva.ai/3ZsjiBpKx13q2cw',
            'freshtalk-radio': 'https://design.canva.ai/1zaDELpV2Jwj2u2',
            'flyer-renard-noir': 'https://design.canva.ai/8SZ-_0ddG3jnELK',
            'ramassage-dechets': 'https://design.canva.ai/16JTM5r1_hyTYXG',
            'livret-partenaire': 'https://design.canva.ai/xynw9oVjYyGkL8I',
            'modele-post-alc': 'https://design.canva.ai/28ah7UoaF8SWK7F',
          }

          for name, url in items.items():
            req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
            with urllib.request.urlopen(req, timeout=30) as r:
              data = r.read()
            img = Image.open(io.BytesIO(data)).convert('RGB')
            if img.width > 1600:
              ratio = 1600 / img.width
              img = img.resize((1600, round(img.height * ratio)), Image.Resampling.LANCZOS)
            out = f'public/portfolio/{name}.webp'
            img.save(out, 'WEBP', quality=90, method=6)
            print(f'{name}: {img.width}x{img.height}')
          PY
          python /tmp/cache.py

      - name: Commit images and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/refresh-portfolio-images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/portfolio .github/workflows/refresh-portfolio-images.yml
          git commit -m 'fix: replace weak portfolio previews'
          git push
