<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; base-uri 'none'; object-src 'none';" />
  <title>Flamme — Services français</title>
  <link rel="stylesheet" href="services.css" />
</head>
<body>
  <main>
    <header>
      <div class="logo">F</div>
      <div><h1>Services français</h1><p>Des alternatives françaises aux principaux services Google.</p></div>
    </header>

    <section class="grid">
      <button data-url="https://www.qwant.com/?l=fr&r=FR&t=all" class="card"><span>Recherche</span><strong>Qwant</strong><small>Français · hébergé en Europe</small></button>
      <button data-url="https://m.laposte.net/" class="card public"><span>Mail + agenda</span><strong>laposte.net</strong><small>100 % français · Groupe La Poste à capitaux publics</small></button>
      <button data-url="https://www.mailo.com/?language=fr" class="card"><span>Mail alternatif</span><strong>Mailo</strong><small>Données stockées en France · agenda + cloud</small></button>
      <button data-url="https://cozy.io/" class="card"><span>Cloud + fichiers</span><strong>Twake / Cozy</strong><small>Plateforme française · données hébergées en France</small></button>
      <button data-url="https://cartes.gouv.fr/" class="card public"><span>Cartes</span><strong>cartes.gouv.fr</strong><small>IGN · service public cartographique</small></button>
      <button data-url="https://lasuite.numerique.gouv.fr/" class="card public"><span>Bureautique publique</span><strong>LaSuite</strong><small>DINUM · Docs, Fichiers, Visio, Tchap, Grist</small></button>
      <button data-url="https://docs.numerique.gouv.fr/" class="card public"><span>Documents</span><strong>Docs</strong><small>Éditeur collaboratif de l’État · ProConnect requis</small></button>
      <button data-url="https://gouv.cryptpad.fr/" class="card public"><span>Suite chiffrée</span><strong>CryptPad LaSuite</strong><small>Développé en France · réservé aux agents éligibles</small></button>
    </section>

    <p class="note">Les cartes marquées « public » correspondent à des services opérés ou soutenus directement par la sphère publique. Certains services de LaSuite nécessitent un compte ProConnect.</p>
  </main>
  <script src="services.js"></script>
</body>
</html>
